# Packaging for Expiry Radar. The tool is a single stdlib-only module
# (expiry_radar.py); this file only makes that module pip-installable
# and adds an `expiry-radar` console command. The file still runs
# standalone with `python3 expiry_radar.py` — no build step, no
# dependencies, nothing changes about how the scanner itself works.
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "expiry-radar"
version = "0.3.1"
description = "Find expiring certificates, JWTs and hardcoded valid-until dates in a repo before they break it. Single file, stdlib only."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["certificate-expiry", "x509", "jwt", "ci", "github-action"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/RakTikoo/expiry-radar"
Repository = "https://github.com/RakTikoo/expiry-radar"

[project.scripts]
expiry-radar = "expiry_radar:main"

[tool.setuptools]
py-modules = ["expiry_radar"]
