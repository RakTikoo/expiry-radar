name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Regenerate fixtures and check they are unchanged in kind
        run: |
          python3 make_fixtures.py
          python3 run_tests.py
      - name: Self-scan (planted fixture faults must be found, exit 2)
        run: |
          set +e
          python3 expiry_radar.py fixtures/fault_jwt_expired_2020 --now 2026-11-10
          test $? -eq 2
